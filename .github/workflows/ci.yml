name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra cpu --group dev
      - run: uv run --locked --extra cpu ruff check .
      - run: uv run --locked --extra cpu ruff format --check .
      - run: uv run --locked --extra cpu mypy

  tests:
    name: CPU tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra cpu --group dev
      - run: uv run --locked --extra cpu pytest
