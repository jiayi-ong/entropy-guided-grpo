[project]
name = "entropy-guided-grpo"
version = "0.1.0"
description = "A small, inspectable multi-turn GRPO research starter."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.57.1",
  "trl==0.29.0",
  "accelerate==1.11.0",
  "peft==0.17.1",
  "httpx==0.28.1",
  "tensorboard==2.20.0",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
cuda = ["torch==2.8.0"]

[dependency-groups]
dev = ["ruff==0.14.6", "pytest==8.4.2", "mypy==1.18.2", "nbformat==5.10.4"]
notebook = ["ipykernel>=6.30,<8"]

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["contracts"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rl_pipeline.trainer", "rl_pipeline.models", "rl_pipeline.train"]
# These modules adapt third-party model and trainer objects with incomplete typing.
disable_error_code = ["attr-defined", "arg-type", "assignment", "no-any-return", "misc"]
